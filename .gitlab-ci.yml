# CI Pipeline（RFC-0006 §5 + §8 阶段 3）
#
# 四阶段流水线：
#   check       → MR 静态检查 + 单元测试
#   build       → tag 触发：构建全部坐标，上传 Registry 归档
#   promote     → tag 触发：复制 ZIP 到 latest/，更新 index.json，提交推送
#   upload-oss  → tag 触发：上传通用包到 OSS（mcpskills/coach/，latest 语义）
#
# tag 格式：<bundle-id>-v<SemVer>（如 ai-customer-v1.0.5）
# 环境变量：GITLAB_API_URL / GITLAB_PROJECT_ID / GITLAB_TOKEN（CI/CD Settings 配置）
#           OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET / OSS_ENDPOINT / OSS_BUCKET
#           OSS_SECURITY_TOKEN（可选，STS 临时凭证）
#           （OSS_* 未配置时 upload-oss 作业自动跳过，不影响既有流水线）

stages: [check, build, promote, upload]

# ── 阶段 1：MR / main 静态检查 ────────────────────────────────────────

check:
  stage: check
  image: python:3.11
  script:
    - pip install -r requirements-dev.txt
    - python3 scripts/check.py
    - python3 -m pytest tests/ -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── 阶段 2：tag 构建 + 归档 ─────────────────────────────────────────

build:
  stage: build
  image: python:3.11
  resource_group: release-dist       # 发布作业串行化
  script:
    - pip install -r requirements-dev.txt
    # 静态检查 + 单元测试（即使直接推 tag 也要验证）
    - python3 scripts/check.py
    - python3 -m pytest tests/ -q
    # 校验 tag 格式与 release-plan 一致性
    - python3 scripts/release_bundle.py plan "$CI_COMMIT_TAG"
    # 构建 + 上传 Registry + 下载核验 + 创建 Release
    - python3 scripts/release_bundle.py archive "$CI_COMMIT_TAG"
  artifacts:
    paths: []                         # 产物在 Registry，不落本地 artifact
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG             # 任何受保护 tag 均触发

# ── 阶段 3：提升 latest/ ─────────────────────────────────────────────

promote:
  stage: promote
  image: python:3.11
  resource_group: release-dist
  script:
    - pip install -r requirements-dev.txt
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI"
    # P3 修复：在 tag 上运行 promote（保证 H3 tag-HEAD 校验），
    # 再基于最新默认分支提交推送，避免快进失败
    - git fetch origin "$CI_DEFAULT_BRANCH" "$CI_COMMIT_TAG"
    - git checkout "$CI_COMMIT_TAG"
    - python3 scripts/release_bundle.py promote "$CI_COMMIT_TAG"
    - |
      # 检测 dist/ 变更（先 git add 把 untracked 文件加入暂存区）
      git add -A dist/
      if git diff --cached --quiet dist/ 2>/dev/null; then
        echo "无 latest/ 变更"
      else
        # 先在 tag 上提交 promote 的输出
        PROMOTE_COMMIT=$(git commit -m "chore(dist): promote $CI_COMMIT_TAG to latest/" --quiet && git rev-parse HEAD)
        # 切换到默认分支并 cherry-pick，推送失败不阻断（用户可本地 promote 后随 MR 合入）
        git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
        git cherry-pick "$PROMOTE_COMMIT"
        if git push origin HEAD:"$CI_DEFAULT_BRANCH" 2>&1; then
          echo "✓ latest/ 已推送到 $CI_DEFAULT_BRANCH"
        else
          echo "⚠️ 无法推送到 $CI_DEFAULT_BRANCH（权限不足），请本地 promote 后随 MR 合入"
        fi
      fi
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build
  artifacts:
    paths: [dist/universal/latest/]    # 供 upload-oss 上传（通用包渠道）
    expire_in: 1 week

# ── 阶段 4：上传通用包到 OSS ─────────────────────────────────────────

upload-oss:
  stage: upload
  image: python:3.11
  resource_group: release-dist         # 与 build/promote 串行，防并发覆盖同一 latest key
  script:
    # 上传作业只需要 OSS SDK，避免安装测试/构建依赖并缩短发布时间
    - pip install --no-cache-dir oss2==2.19.1
    - python3 scripts/upload_oss.py dist/universal/latest/
  rules:
    # 全部凭证均未配置时跳过；只配置部分变量则执行并由脚本明确报错，避免静默漏发
    - if: '$CI_COMMIT_TAG && $OSS_ACCESS_KEY_ID && $OSS_ACCESS_KEY_SECRET && $OSS_ENDPOINT && $OSS_BUCKET'
    - if: '$CI_COMMIT_TAG && ($OSS_ACCESS_KEY_ID || $OSS_ACCESS_KEY_SECRET || $OSS_ENDPOINT || $OSS_BUCKET)'
  needs:
    - job: promote
      artifacts: true
